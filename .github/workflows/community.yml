name: SPEPE Community

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "command or scan"
        required: true
        default: "scan"
        type: choice
        options:
          - scan
          - command
      telegram_update:
        description: "Telegram update JSON"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: spepe-community
  cancel-in-progress: false

jobs:
  community:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run community service
        env:
          X_HANDLE: "SaiyanPEPE"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_COMMUNITY_WEBHOOK_URL: ${{ secrets.DISCORD_COMMUNITY_WEBHOOK_URL }}
          COMMUNITY_STATE_FILE: "community-state.json"
          COMMUNITY_MODE: ${{ inputs.mode }}
          TELEGRAM_UPDATE_JSON: ${{ inputs.telegram_update }}
        run: node community.js

      - name: Save community state
        run: |
          if [ -z "$(git status --porcelain -- community-state.json)" ]; then
            echo "No community state changes."
            exit 0
          fi
          git config user.name "spepe-community-bot"
          git config user.email "spepe-community-bot@users.noreply.github.com"
          git add community-state.json
          git commit -m "chore: update community state"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push raced with another commit. Rebasing and retrying ($attempt/3)..."
            git pull --rebase origin main
          done

          echo "Failed to save community state after 3 attempts."
          exit 1
