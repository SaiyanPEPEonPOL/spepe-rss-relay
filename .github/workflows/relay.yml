name: SPEPE RSS Relay

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spepe-rss-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Check RSS and relay new posts
        env:
          RSS_URL: ${{ secrets.RSS_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELAY_NAME: "SPEPE Relay"
          INITIALIZE_ONLY: "true"
          MAX_POSTS_PER_RUN: "5"
        run: node index.js

      - name: Save relay state
        run: |
          if git diff --quiet -- state.json; then
            echo "No state changes."
            exit 0
          fi
          git config user.name "spepe-relay-bot"
          git config user.email "spepe-relay-bot@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update relay state"
          git push
